name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mars.gripe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /healthz
        run: |
          docker run -d --name smoke -p 8000:8000 mars.gripe:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "healthcheck ok"
              exit 0
            fi
            sleep 1
          done
          echo "healthcheck never responded"
          docker logs smoke
          exit 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on husavik
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"project": "xcast"}' \
            https://deploy.jawnnypoo.com/deploy
